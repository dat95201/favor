# Experiment protocol (Section 5). Every value here is a development-split
# choice; freeze this file (commit hash) before the first test-split run
# (Section 5.10). DESIGN.md maps each value to the proposal's [TBD]/[CHOOSE].
protocol:
  budget_b: 20                # validated patches per run; re-fit on dev split
  max_conversation_length: 3  # L, as ChatRepair
  k: 3                        # memory entries per prompt, from {1, 3, 5}
  m: 3                        # patches per VS call, from {3, 5}
  runs_per_bug: 3             # r
  temperature: 1.0
  hot_temperature: 1.3        # CR-hot
  diff_max_lines: 16          # memory-entry diff truncation
  score_weights: [1.0, 1.0, 1.0]   # frequency, recency, absence (Section 4.4)
  seed: 20261117
  delta: 0.03                 # non-inferiority margin (repair-rate points)
  dev_fraction: 0.2
  flaky_runs: 5
  slow_suite_limit_s: 600     # exclude bugs whose relevant tests exceed 10 min
  test_timeout_factor: 5.0    # per-run test timeout = 5 x fixed-version time
  test_timeout_min_s: 300
  l2_alpha_rename: true
  signature_stack_frames: 1
  n_bootstrap: 10000
  max_output_tokens: 4096

# Table-5 rows to run by default (override per run with --configs)
configurations:
  - IS
  - IS+VS
  - CR
  - CR-hot
  - CR+Mem
  - CR+Rand
  - CR+TopK
  - CR+TopK-reset
  - CR+VS
  - CR+VS-noProb
  - CR+Mem+VS
  - FaVoR
