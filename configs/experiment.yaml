# Experiment protocol (Section 5). Every value here is a development-split
# choice; freeze this file (commit hash) before the first test-split run
# (Section 5.10). DESIGN.md maps each value to the proposal's [TBD]/[CHOOSE].
protocol:
  budget_b: 20                # validated patches per run; re-fit on dev split
  max_conversation_length: 3  # L, in ATTEMPTS (validated + L2 repeats), so every
                              # arm restarts after the same number of attempts
  max_llm_calls: 200          # termination cap: repeats/unparseable consume no
                              # budget, so B alone does not guarantee termination
  k: 3                        # memory entries per prompt, from {1, 3, 5}
  m: 3                        # patches per VS call, from {3, 5}
  runs_per_bug: 3             # r (ablations may run r' < r: copy this file)
  temperature: 1.0
  hot_temperature: 1.3        # CR-hot
  diff_max_lines: 16          # memory-entry diff truncation
  score_weights: [1.0, 1.0, 1.0]   # frequency, recency, absence (Section 4.4)
  seed: 20261117
  delta: 0.07                 # non-inferiority margin (repair-rate points).
                              # Power-driven: at r=3 and N~100-300 bugs,
                              # delta=0.03 detects true non-inferiority with
                              # only ~0.2-0.4 probability; ~0.9 at 0.07.
                              # Section 5.10 defines delta by judgment, fixed
                              # before any test-split run.
  dev_fraction: 0.2
  flaky_runs: 5
  slow_suite_limit_s: 600     # exclude bugs whose relevant tests exceed 10 min
  test_timeout_factor: 5.0    # per-run test timeout = 5 x fixed-version time
  test_timeout_min_s: 300
  l2_alpha_rename: true
  signature_stack_frames: 1
  n_bootstrap: 10000
  max_output_tokens: 4096

# Which Table-5 arms to run, by tier. Uncomment to enable; `favor run
# --configs A,B` overrides this list for one invocation.
configurations:
  # --- tier 1: confirmatory pair (CR vs FaVoR), 2x2 mechanism factorial,
  #     sampling reference, instruction-only control, persistence ablation
  #     (the cleanest H1 test). Full r, both models.
  - IS
  - CR
  - CR+Instr
  - CR+TopK
  - CR+TopK-reset
  - CR+VS
  - FaVoR
  # --- tier 2: if compute allows, primary model only. For r' < r
  #     (Section 5.5), copy this file, set runs_per_bug, pass --experiment.
  # - IS+VS                 # VS under independent sampling (H2)
  # - CR+Rand               # scoring vs merely having a memory (same k)
  # --- tier 3: future work.
  # - CR+Mem                # full memory, prompt-length confound
  # - CR+Mem+VS             # completes the full-memory factorial
  # - CR-hot                # temperature as the diversity lever
  # - CR+VS-noProb          # Sequence baseline: fixes without probabilities
