[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "favor"
version = "0.1.0"
description = "FaVoR: failure-aware prompting and verbalized diversification for conversational program repair — Defects4J experiment harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40,<3",
  "pyyaml>=6",
  "tree-sitter>=0.22,<0.26",
  "tree-sitter-java>=0.21",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
favor = "favor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
